<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b14"/>
      <stop offset="50%" stop-color="#150f24"/>
      <stop offset="100%" stop-color="#07060a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border with Glow -->
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Geometric Rune / System Hexagon Rings -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Hex Diamond Ring -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" fill="none" stroke="#a855f7" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="16 8"/>
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Central Monarch Rune Dagger / Crest -->
    <path d="M 0,-140 L 22,-20 L 70,30 L 20,40 L 0,130 L -20,40 L -70,30 L -22,-20 Z" fill="url(#purpleGrad)" filter="url(#glow)"/>

    <!-- Inner Core Eye / Crystal -->
    <polygon points="0,-60 20,-10 0,40 -20,-10" fill="#ffffff" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="-5" r="7" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Side Energy Wings -->
    <path d="M -24,-10 L -90,-40 L -120,20 L -60,20 Z" fill="url(#purpleGrad)" opacity="0.8"/>
    <path d="M 24,-10 L 90,-40 L 120,20 L 60,20 Z" fill="url(#purpleGrad)" opacity="0.8"/>

    <!-- Gold Accent Energy Flares -->
    <circle cx="0" cy="-140" r="5" fill="#fef08a" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="130" r="4" fill="#eab308"/>
    <circle cx="-156" cy="0" r="3.5" fill="#a855f7"/>
    <circle cx="156" cy="0" r="3.5" fill="#a855f7"/>
  </g>
</svg>
